schema_version: 1

context:
  name: mlx
  version: "0.32.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # There are no sources on PyPI
  url: https://github.com/ml-explore/mlx/archive/v${{ version }}.tar.gz
  sha256: 8e74a0eb613861ce50c09402dd99dbc42b65a762e7fdd291caa39f611db978ec
  patches:
    - 0001-Omit-visionOS-from-sources.patch
    # Build the M-series NAX (MetalPerformancePrimitives) kernels without
    # raising the library deployment target. See the patch header for details.
    - 0002-Build-M-series-NAX-Metal-kernels-without-raising-the-.patch

build:
  number: 1
  skip: win or match(python, "<3.9") or (osx and x86_64)

requirements:
  build:
    # need python in the build section to properly build the extensions
    - python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake >=3.24
    - ninja
  host:
    - python
    - pip
    - nanobind
    - setuptools >=42
    - if: not (osx and arm64)
      then:
        - libblas
        - libcblas
        - liblapack
        - liblapacke
  run:
    - python

tests:
  - python:
      imports:
        - mlx
        - mlx.core
  - files:
      source:
        - python/
    requirements:
      run:
        - pip
        - numpy
    script:
      - pip check
      - if: osx and arm64
        then: python -m unittest discover python/tests
  # mlx_nax.metallib (the separate Metal 4 / NAX shader library added by
  # recipe/0002-*.patch) -- along with this test and that patch -- can be dropped
  # once MACOSX_DEPLOYMENT_TARGET is raised past 26.2.
  - script:
      - if: osx and arm64
        then: python check_nax_metallib.py
    files:
      recipe:
        - check_nax_metallib.py

about:
  summary: An array framework for Apple silicon
  license: MIT
  license_file: LICENSE
  description: |
    MLX is an array framework for machine learning on Apple silicon, brought to you by Apple machine learning research.
  homepage: https://github.com/ml-explore/mlx
  repository: https://ml-explore.github.io/mlx/build/html/index.html
  documentation: https://github.com/ml-explore/mlx

extra:
  recipe-maintainers:
    - xhochy
    - ngam
