name: debug metal toolchain
on: push
jobs:
  debug:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: probe in rattler-build
        shell: bash
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          export PATH="$HOME/.pixi/bin:$PATH"
          echo "outer HOME=$HOME TMPDIR=${TMPDIR:-<unset>}"
          pixi exec rattler-build build --recipe probe -c conda-forge --output-dir /tmp/probe-out 2>&1 | grep -E "R[0-9]:|HOME=|TMPDIR=|CFFIXED|Apple metal|Status:|Done downloading|error" || true
