name: debug metal toolchain
on: push
jobs:
  debug:
    runs-on: xcode-27
    steps:
      - name: probe
        shell: bash
        run: |
          set -x
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcrun -sdk macosx metal --version || echo "0: missing before download (expected)"
          /usr/bin/xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version && echo "IMMEDIATE: works" || echo "IMMEDIATE: missing right after download"
          for i in $(seq 1 15); do
            if xcrun -sdk macosx metal --version >/dev/null 2>&1; then echo "WAIT: works after ${i} tries without showComponent"; break; fi
            sleep 2
          done
          xcodebuild -showComponent metalToolchain || true
          xcrun -sdk macosx metal --version && echo "AFTER showComponent: works" || echo "AFTER showComponent: missing"
